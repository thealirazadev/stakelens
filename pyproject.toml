[project]
name = "stakelens"
version = "0.1.0"
description = "Reorg-safe staking indexer, wallet sign-in API, and a read-only Claude assistant over on-chain data."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "contracts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["chain: needs a local anvil node and compiled contracts"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
