services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stakelens
      POSTGRES_PASSWORD: stakelens
      POSTGRES_DB: stakelens
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stakelens"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
