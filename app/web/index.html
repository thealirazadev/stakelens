<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stakelens</title>
<style>
  html { font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1a1a1a; background: #fff; }
  body { margin: 0 auto; max-width: 1080px; padding: 10px 14px 40px; }
  a { color: #0645ad; text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #1a1a1a; padding-bottom: 4px; }
  header b { font-size: 15px; }
  #sync { color: #555; }
  #sync.behind { color: #a15c00; }
  #wallet { margin-left: auto; }
  h2 { font-size: 13px; margin: 20px 0 4px; }
  h2 small { font-weight: normal; color: #666; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: normal; color: #666; border-bottom: 1px solid #999; padding: 2px 10px 2px 0; white-space: nowrap; }
  td { border-bottom: 1px solid #e4e4e4; padding: 2px 10px 2px 0; white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  .pending { color: #a15c00; }
  .muted { color: #777; }
  .err { color: #b00020; }
  #summary td:first-child { color: #666; width: 170px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  button { font: inherit; padding: 1px 8px; }
  input[type=text] { font: inherit; width: 100%; box-sizing: border-box; padding: 2px 4px; border: 1px solid #999; }
  form { display: flex; gap: 6px; }
  #answer { white-space: pre-wrap; margin: 8px 0 0; }
  @media (max-width: 760px) { .split { display: block; } td, th { white-space: normal; } }
</style>
</head>
<body>
<header>
  <b>stakelens</b>
  <span id="sync">connecting...</span>
  <span id="wallet"><button id="connect" type="button">Sign in with wallet</button></span>
</header>

<table id="summary" style="margin-top:8px"><tbody></tbody></table>

<div class="split">
  <section>
    <h2>Largest stakes</h2>
    <table><thead><tr><th>Wallet</th><th class="num">Staked (STK)</th></tr></thead><tbody id="stakers"></tbody></table>
  </section>
  <section>
    <h2>Reorgs handled</h2>
    <table><thead><tr><th>Detected</th><th class="num">Old tip</th><th class="num">Rolled back to</th><th class="num">Depth</th><th class="num">Events removed</th></tr></thead><tbody id="reorgs"></tbody></table>
  </section>
</div>

<h2>Events <small id="events-note"></small></h2>
<table>
  <thead><tr><th>Block</th><th>Time (UTC)</th><th>Event</th><th>Wallet</th><th class="num">Amount (STK)</th><th>Tx</th><th class="num">Confs</th><th>Status</th></tr></thead>
  <tbody id="events"></tbody>
</table>

<h2>Ask about the vault <small>read-only, signed-in wallets only</small></h2>
<form id="ask"><input type="text" id="question" maxlength="1000" placeholder="How much have I staked, and is it all confirmed?" disabled><button type="submit" disabled>Ask</button></form>
<p id="answer"></p>

<script>
const $ = (id) => document.getElementById(id);
const short = (hash) => hash.slice(0, 8) + "..." + hash.slice(-4);
let token = null;

function row(cells) {
  const tr = document.createElement("tr");
  for (const [value, className] of cells) {
    const td = document.createElement("td");
    td.textContent = value;
    if (className) td.className = className;
    tr.append(td);
  }
  return tr;
}

function fill(id, rows, emptyText, columns) {
  const body = $(id);
  if (!rows.length) {
    const td = document.createElement("td");
    td.colSpan = columns;
    td.className = "muted";
    td.textContent = emptyText;
    const tr = document.createElement("tr");
    tr.append(td);
    body.replaceChildren(tr);
    return;
  }
  body.replaceChildren(...rows);
}

async function getJson(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.detail || response.statusText);
  return body;
}

function clock(iso) {
  return iso.slice(0, 19).replace("T", " ");
}

function reconcileCell(check) {
  if (!check) return ["not run yet", "muted"];
  const detail = `at block ${check.block_number}, ${check.wallets_checked} wallets`;
  return check.ok ? [`matches ${detail}`] : [`MISMATCH ${detail}`, "err"];
}

async function refresh() {
  try {
    const [stats, events, stakers, reorgs, reconciliation] = await Promise.all([
      getJson("/vault/stats"), getJson("/vault/events?limit=25"),
      getJson("/vault/stakers"), getJson("/vault/reorgs"), getJson("/vault/reconciliation"),
    ]);

    const sync = $("sync");
    sync.textContent = stats.blocks_behind
      ? `indexing, ${stats.blocks_behind} blocks behind head ${stats.chain_head}`
      : `in sync at block ${stats.last_indexed_block}`;
    sync.className = stats.blocks_behind ? "behind" : "";

    fill("summary", [
      row([["Total staked"], [`${stats.total_staked.tokens} STK`, "mono"]]),
      row([["Confirmed"], [`${stats.confirmed_staked.tokens} STK`, "mono"]]),
      row([["Active stakers"], [stats.active_stakers]]),
      row([["Events indexed"], [stats.event_count]]),
      row([["Check against contract"], reconcileCell(reconciliation)]),
    ], "", 2);

    $("events-note").textContent = `confirmed after ${stats.confirmations_required} blocks`;
    fill("events", events.map((e) => row([
      [e.block_number, "mono"], [clock(e.block_time), "mono"], [e.name],
      [short(e.wallet), "mono"], [e.amount.tokens, "num mono"], [short(e.tx_hash), "mono"],
      [e.confirmations, "num"], [e.status, e.status === "pending" ? "pending" : "muted"],
    ])), "No events yet.", 8);

    fill("stakers", stakers.map((s) => row([
      [short(s.wallet), "mono"], [s.staked.tokens, "num mono"],
    ])), "Nothing staked.", 2);

    fill("reorgs", reorgs.map((r) => row([
      [clock(r.detected_at), "mono"], [r.old_tip, "num"], [r.ancestor_block, "num"],
      [r.depth, "num"], [r.events_removed, "num"],
    ])), "None so far.", 5);
  } catch (error) {
    $("sync").textContent = `API unreachable: ${error.message}`;
    $("sync").className = "err";
  }
}

async function signIn() {
  if (!window.ethereum) {
    $("wallet").textContent = "No browser wallet found";
    return;
  }
  const [address] = await window.ethereum.request({ method: "eth_requestAccounts" });
  const post = (path, data) => getJson(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  const challenge = await post("/auth/challenge", { address });
  const signature = await window.ethereum.request({
    method: "personal_sign", params: [challenge.message, address],
  });
  const session = await post("/auth/verify", { nonce: challenge.nonce, signature });
  token = session.token;
  $("wallet").textContent = short(session.wallet);
  $("wallet").className = "mono";
  $("question").disabled = false;
  document.querySelector("#ask button").disabled = false;
}

$("connect").addEventListener("click", () => signIn().catch((error) => {
  $("wallet").textContent = error.message;
  $("wallet").className = "err";
}));

$("ask").addEventListener("submit", async (event) => {
  event.preventDefault();
  const answer = $("answer");
  answer.className = "muted";
  answer.textContent = "Checking the indexed data...";
  try {
    const result = await getJson("/assistant/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ question: $("question").value }),
    });
    answer.className = "";
    answer.textContent = result.answer;
  } catch (error) {
    answer.className = "err";
    answer.textContent = error.message;
  }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
